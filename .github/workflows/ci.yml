name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q ingestion spark airflow/dags
      # tests/ 里有测试之后，再加上这两步：
      # - run: pip install -r requirements.txt pyspark==3.5.3 delta-spark==3.3.2 pytest
      # - run: pytest tests/
