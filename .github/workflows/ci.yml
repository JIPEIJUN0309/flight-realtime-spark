name: ci

on:
  push:
  pull_request:

jobs:
  # 语法检查：所有 Python 文件都要能解析（不导入依赖，所以很快）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q ingestion spark airflow/dags

  # 单元测试：不需要 Kafka / Delta / PostgreSQL，起一个本地 SparkSession 跑
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pyspark and pytest
        run: pip install pyspark==3.5.3 pytest
      - name: Unit tests
        run: pytest tests -q
        env:
          # 让 worker 和 driver 用同一个解释器（pyspark 的默认值在 CI 里可能对不上）
          PYSPARK_PYTHON: python
