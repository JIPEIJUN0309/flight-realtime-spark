# ============================================================
# 主栈：Kafka + Spark + PostgreSQL + Grafana
# （Kafka UI 看消息，Grafana 看实时卡片和统计报表）
# ============================================================

# 固定 project 名，不随所在目录名变化。
# 否则 compose 拿目录名当 project 名，一旦目录改名或移动，named volume
# 前缀就变了 —— kafka_data / postgres_data 会失联，Grafana 看板和
# Kafka 里的数据全部对不上。
name: flight-realtime-spark

services:
  # ---------- Kafka (KRaft 模式) ----------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "INTERNAL://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------- Kafka UI ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "flight-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # ---------- Spark（自定义镜像：预装 Delta + Kafka 连接器）----------
  spark:
    build:
      context: ./spark
    container_name: spark
    ports:
      - "4040:4040"
    environment:
      # 限制 glibc 的每线程 arena：实时作业跑两小时后 JVM 堆只用了 1.3/2 GB，
      # 容器 anon 却涨到 4.6 GB 并被 cgroup OOM 杀掉。设成 2 之后稳定在 2.4–3.4 GB。
      MALLOC_ARENA_MAX: "2"
      # 质量规则的完整率分母按采集间隔算（dq_checks 的 DQ_POLL_INTERVAL）。
      # 采集器读 .env 的 POLL_INTERVAL，容器里必须拿到同一个值：否则平时 30 秒轮询时
      # 完整率只有约 33%，强规则会误判失败、把 ADS 挡掉（项目报告 M10）。
      DQ_POLL_INTERVAL: "${POLL_INTERVAL:-10}"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./spark:/opt/spark/work-dir/jobs
      # 数据目录放在仓库外，路径写在 .env 的 DATA_DIR。没设置就直接报错，
      # 而不是让 Docker 悄悄建一个空文件夹挂进去，让作业以为一条数据都没有
      - "${DATA_DIR:?在 .env 里设置 DATA_DIR（数据目录），见 .env.example}:/data"
      # Delta 表和流式 checkpoint 放 Docker 卷（WSL2 虚拟机里的 ext4），叠在上面 /data 的子目录上；
      # bench/、ml/ 等冷数据仍在 DATA_DIR。Windows 的盘经 9p 挂进容器，小文件的元数据操作慢一两千倍，
      # 而 Delta 每次读写都要列一遍 _delta_log：M3 诊断实测 bronze 只有 1,025 个日志文件，列一次 7.5 秒
      - lake_delta:/data/delta
      - lake_checkpoint:/data/checkpoint
      - ./dim:/opt/spark/work-dir/dim
    deploy:
      resources:
        limits:
          # M3 验收时踩到的坑：4g 在早高峰（每张快照 375 架、每批 5 秒）被 cgroup OOM 杀掉过一次
          # （memory.events 里 oom_kill=1，驱动进程直接消失）。5g 留出余量；同时把 Grafana 的
          # 让出虚拟机内存。再往上加要看 Docker Desktop 给虚拟机分配了多少内存
          memory: 5g

  # ---------- PostgreSQL（ADS 应用层结果库）----------
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight123
      POSTGRES_DB: flightdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flightdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Grafana（实时卡片 + 统计报表）----------
  # 两块看板都放 Grafana：实时卡片读服务层三张表、5 秒刷新；统计报表读 ADS 表、1 分钟刷新。
  # 数据源和看板都由 grafana/ 下的文件自动建好（provisioning），打开 http://localhost:3002 直接看。
  # 原来另起过一个 Metabase 做统计报表，M4 之后统一到 Grafana：一个工具、一套权限（只读账号
  # grafana_ro）、看板随仓库走，不用在界面上手工维护。
  grafana:
    image: grafana/grafana:11.6.16
    container_name: flight-grafana
    ports:
      - "3002:3000"      # 3000 已被本机另一个项目占用，3001 曾是本项目的 Metabase
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: flight123
      # 值班大屏免登录只读；改看板用 admin 登录
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/realtime.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka_data:
  postgres_data:
  grafana_data:
  # 卷名带 project 前缀：flight-realtime-spark_lake_delta、flight-realtime-spark_lake_checkpoint。
  # docker compose down -v 会把它们连同数据删掉，平时只用 stop / start
  lake_delta:
  lake_checkpoint:
